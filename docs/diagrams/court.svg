<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" width="520" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="520" height="560" fill="#ffffff"/>
  <!-- court: 10 px per foot, origin at (160,50) -->
  <rect x="160" y="50" width="200" height="440" fill="#dbeafe" stroke="#0f172a" stroke-width="2"/>
  <rect x="160" y="200" width="200" height="140" fill="#bfdbfe" stroke="none"/>
  <line x1="160" y1="200" x2="360" y2="200" stroke="#0f172a" stroke-width="2"/>
  <line x1="160" y1="340" x2="360" y2="340" stroke="#0f172a" stroke-width="2"/>
  <line x1="260" y1="50" x2="260" y2="200" stroke="#0f172a" stroke-width="2"/>
  <line x1="260" y1="340" x2="260" y2="490" stroke="#0f172a" stroke-width="2"/>
  <line x1="150" y1="270" x2="370" y2="270" stroke="#0f172a" stroke-width="4"/>
  <circle cx="160" cy="50" r="5" fill="#dc2626"/>

  <g font-size="12" fill="#0f172a">
    <text x="150" y="40" text-anchor="end" fill="#dc2626" font-weight="bold">origin (0, 0)</text>
    <text x="370" y="54">far baseline · y = 0</text>
    <text x="370" y="204">far kitchen line · y = 15</text>
    <text x="378" y="274" font-weight="bold">net · y = 22</text>
    <text x="370" y="344">near kitchen line · y = 29</text>
    <text x="370" y="494">near baseline · y = 44</text>
    <text x="160" y="508" text-anchor="middle">x = 0</text>
    <text x="260" y="508" text-anchor="middle">x = 10</text>
    <text x="360" y="508" text-anchor="middle">x = 20</text>
    <text x="210" y="240" text-anchor="middle" font-size="11">far kitchen</text>
    <text x="210" y="310" text-anchor="middle" font-size="11">near kitchen</text>
    <text x="210" y="130" text-anchor="middle" font-size="11">service</text>
    <text x="310" y="130" text-anchor="middle" font-size="11">service</text>
    <text x="210" y="420" text-anchor="middle" font-size="11">service</text>
    <text x="310" y="420" text-anchor="middle" font-size="11">service</text>
  </g>
  <line x1="40" y1="80" x2="110" y2="80" stroke="#1d4ed8" stroke-width="2" marker-end="url(#c)"/>
  <text x="40" y="70" font-size="12" fill="#1d4ed8">x (feet)</text>
  <line x1="40" y1="100" x2="40" y2="170" stroke="#1d4ed8" stroke-width="2" marker-end="url(#c)"/>
  <text x="48" y="150" font-size="12" fill="#1d4ed8">y (feet)</text>

  <!-- camera -->
  <rect x="236" y="526" width="48" height="24" rx="4" fill="#0f172a"/>
  <circle cx="260" cy="538" r="7" fill="#64748b"/>
  <text x="296" y="543" font-size="12" fill="#0f172a">camera (DTL, behind near baseline)</text>
</svg>
