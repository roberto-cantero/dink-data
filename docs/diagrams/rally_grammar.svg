<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
  <g font-size="12" fill="#0f172a">
    <rect x="20" y="40" width="140" height="80" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="90" y="70" text-anchor="middle" font-weight="bold">SERVE</text>
    <text x="90" y="90" text-anchor="middle" font-size="11">hit by the known server</text>
    <text x="90" y="106" text-anchor="middle" font-size="11">(from serve state)</text>

    <rect x="200" y="40" width="150" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="275" y="70" text-anchor="middle" font-weight="bold">BOUNCE</text>
    <text x="275" y="90" text-anchor="middle" font-size="11">in the diagonal</text>
    <text x="275" y="106" text-anchor="middle" font-size="11">service court</text>

    <rect x="390" y="40" width="140" height="80" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="460" y="70" text-anchor="middle" font-weight="bold">RETURN</text>
    <text x="460" y="90" text-anchor="middle" font-size="11">hit by the receiver</text>
    <text x="460" y="106" text-anchor="middle" font-size="11">after the bounce</text>

    <rect x="570" y="40" width="150" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="645" y="70" text-anchor="middle" font-weight="bold">BOUNCE</text>
    <text x="645" y="90" text-anchor="middle" font-size="11">on the serving side</text>
    <text x="645" y="106" text-anchor="middle" font-size="11">(two-bounce rule)</text>

    <rect x="760" y="40" width="180" height="80" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="850" y="70" text-anchor="middle" font-weight="bold">THIRD SHOT</text>
    <text x="850" y="90" text-anchor="middle" font-size="11">hit by the serving team</text>
    <text x="850" y="106" text-anchor="middle" font-size="11">volleys allowed after this shot</text>

    <rect x="250" y="170" width="460" height="90" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="480" y="196" text-anchor="middle" font-weight="bold">OPEN PLAY (repeats)</text>
    <text x="480" y="218" text-anchor="middle" font-size="11">hit by team X → either a bounce on team Y's side, then a hit by team Y,</text>
    <text x="480" y="236" text-anchor="middle" font-size="11">or a volley by team Y (no bounce) · teams always alternate</text>

    <rect x="120" y="310" width="720" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="480" y="336" text-anchor="middle" font-weight="bold" fill="#b91c1c">RALLY ENDS</text>
    <text x="480" y="358" text-anchor="middle" font-size="11">net · out (bounce outside lines) · double bounce · unreturned · fault (e.g. serve out, kitchen line, volleyed return) · unexplained</text>
  </g>
  <line x1="160" y1="80" x2="198" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#g)"/>
  <line x1="350" y1="80" x2="388" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#g)"/>
  <line x1="530" y1="80" x2="568" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#g)"/>
  <line x1="720" y1="80" x2="758" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#g)"/>
  <path d="M850,120 C850,170 760,200 712,210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#g)"/>
  <path d="M250,230 C200,230 200,190 248,195" fill="none" stroke="#ca8a04" stroke-width="2" marker-end="url(#g)"/>

  <line x1="90" y1="120" x2="200" y2="308" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <line x1="275" y1="120" x2="290" y2="308" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <line x1="480" y1="260" x2="480" y2="308" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="490" y="290" font-size="11" fill="#b91c1c">an error at any step (red dashes) ends the rally</text>
</svg>
