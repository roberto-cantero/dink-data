<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <g font-size="12" fill="#0f172a">
    <rect x="300" y="20" width="280" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="440" y="50" text-anchor="middle" font-weight="bold">1 · Pipeline processes a game</text>
    <text x="440" y="72" text-anchor="middle" font-size="11">every event and stat carries a confidence</text>

    <rect x="590" y="190" width="270" height="90" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="725" y="220" text-anchor="middle" font-weight="bold">2 · Review in the studio</text>
    <text x="725" y="242" text-anchor="middle" font-size="11">lowest confidence first</text>
    <text x="725" y="260" text-anchor="middle" font-size="11">fixes saved as patches</text>

    <rect x="300" y="370" width="280" height="80" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="440" y="400" text-anchor="middle" font-weight="bold">3 · Silver labels</text>
    <text x="440" y="422" text-anchor="middle" font-size="11">patched games become training data</text>

    <rect x="20" y="190" width="270" height="90" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="155" y="220" text-anchor="middle" font-weight="bold">4 · Retrain models</text>
    <text x="155" y="242" text-anchor="middle" font-size="11">ball tracker, event spotter</text>
    <text x="155" y="260" text-anchor="middle" font-size="11">new version replaces old only if better</text>

    <rect x="340" y="190" width="200" height="90" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="440" y="218" text-anchor="middle" font-weight="bold">Gold set + eval gate</text>
    <text x="440" y="240" text-anchor="middle" font-size="11">measures every new model</text>
    <text x="440" y="258" text-anchor="middle" font-size="11">never used for training</text>
  </g>
  <path d="M580,60 C700,60 725,120 725,186" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <path d="M725,280 C725,350 680,410 584,410" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <path d="M300,410 C200,410 155,350 155,284" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <path d="M155,190 C155,120 200,60 296,60" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <line x1="290" y1="235" x2="338" y2="235" stroke="#ca8a04" stroke-width="1.6" stroke-dasharray="5 4" marker-start="url(#f)" marker-end="url(#f)"/>
  <line x1="590" y1="250" x2="542" y2="250" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f)"/>
  <text x="548" y="300" font-size="10" fill="#7e22ce">corrections also tune</text>
  <text x="548" y="314" font-size="10" fill="#7e22ce">the leave-out thresholds</text>
</svg>
