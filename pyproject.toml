[project]
name = "dinkdata"
version = "0.1.0"
description = "Per-player pickleball stats and highlight reels from PickleCam video."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.13"
# Core: enough for contracts, stats, eval and the CLI, with no PyTorch.
dependencies = [
    "numpy>=2.0",
    "pyarrow>=17",
    "pydantic>=2.8",
    "typer>=0.12",
]

[project.optional-dependencies]
# Computer vision. Player models (RF-DETR, RTMPose, ByteTrack) are added by the M0 player spike.
cv = ["torch>=2.6", "torchvision>=0.21", "opencv-python-headless>=4.10"]
# Pick one PyTorch build with `cv`: `--extra cpu` (CI, Macs, which still get MPS) or
# `--extra cu126` (NVIDIA GPUs).
cpu = ["torch>=2.6", "torchvision>=0.21"]
cu126 = ["torch>=2.6", "torchvision>=0.21"]
studio = [
    "fastapi>=0.150.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
dink = "dinkdata.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=4",
    "jsonschema>=4.23",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkdata"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "NPY"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "gpu: needs a CUDA GPU (skipped in CI)",
    "data: needs real videos or labels from the data store (skipped in CI)",
]

[tool.coverage.run]
source = ["dinkdata"]
