[project]
name = "dinkdata"
version = "0.1.0"
description = "Per-player pickleball stats from single-camera PickleCam video."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "typer>=0.12",
]

[project.optional-dependencies]
# Pick one torch build: `--extra cpu` (CI, laptops; Macs still get MPS) or
# `--extra cu126` (NVIDIA GPU machines). Without either, torch comes from PyPI.
cpu = ["torch>=2.6", "torchvision>=0.21"]
cu126 = ["torch>=2.6", "torchvision>=0.21"]
players = ["ultralytics>=8.3"]

[project.scripts]
dink-cv = "pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=4",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "stats", "eval"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "NPY"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["pipeline", "stats", "eval", "tests"]
exclude = ["legacy", ".venv"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "gpu: needs a CUDA GPU (skipped in CI)",
    "data: needs real videos or labels from the data store (skipped in CI)",
]

[tool.coverage.run]
source = ["pipeline", "stats", "eval"]
